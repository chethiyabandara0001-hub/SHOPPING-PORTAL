<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viora | Premium Textiles & Fabrics</title>
    <meta name="description" content="Viora - Discover exquisite textiles, premium fabrics, and fine materials for your next creation." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%238B4513'/%3E%3Cpath d='M8 8 L24 8 L24 24 L8 24 Z' fill='none' stroke='%23D4AF37' stroke-width='2'/%3E%3Cpath d='M12 12 Q16 8 20 12 T20 20 Q16 24 12 20 T12 12' fill='none' stroke='%23D4AF37' stroke-width='1.5' opacity='0.6'/%3E%3C/svg%3E" />

    <!-- Preconnect with proper crossorigin -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Elegant fonts for luxury textile brand: Playfair Display (headings) & Lato (body) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Preload critical assets -->
    <link rel="modulepreload" href="/src/main.tsx" />
    
    <!-- Inline critical CSS for faster FCP -->
    <style>
      #root { min-height: 100vh; background: #FAF9F6; }
      .viora-skeleton { background: linear-gradient(90deg, #f0ede9 25%, #e8e4df 50%, #f0ede9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
      @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Elegant skeleton loader for perceived performance -->
      <div style="padding: 2rem; max-width: 1400px; margin: 0 auto;">
        <div class="viora-skeleton" style="height: 80px; width: 200px; margin-bottom: 3rem; border-radius: 2px;"></div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2.5rem;">
          <div class="viora-skeleton" style="height: 420px; border-radius: 2px;"></div>
          <div class="viora-skeleton" style="height: 420px; border-radius: 2px;"></div>
          <div class="viora-skeleton" style="height: 420px; border-radius: 2px;"></div>
          <div class="viora-skeleton" style="height: 420px; border-radius: 2px;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
